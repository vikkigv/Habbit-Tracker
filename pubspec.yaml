name: habit_tracker
description: A daily habit tracker app with calendar view.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  table_calendar: ^3.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_slidable: ^3.1.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
